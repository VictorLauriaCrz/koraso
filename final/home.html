<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korasõ - Home</title>
    <link rel="stylesheet" href="custom.css">
</head>

<body>
    <div class="app-container">

        <!-- Cabeçalho Azul com Calendário -->
        <header class="home-header">
            <div class="home-top-bar">
               <img src="media/Group 62.svg" alt="">
                <div class="profile-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0c4d8b" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
            </div>

            <h1 class="greeting-title">Olá, Rodrigo</h1>
            <p class="greeting-sub">Tenha um ótimo dia!</p>
            <hr class="header-divider">

            <div class="calendar-card">
                <h4>Maio de 2026</h4>
                <div class="calendar-days">
                    <div class="day"><span>S</span><span>07</span></div>
                    <div class="day"><span>T</span><span>08</span></div>
                    <div class="day"><span>Q</span><span>09</span></div>
                    <div class="day active"><span>Q</span><span>10</span></div>
                    <div class="day"><span>S</span><span>11</span></div>
                    <div class="day"><span>S</span><span>12</span></div>
                    <div class="day"><span>D</span><span>13</span></div>
                </div>
            </div>
        </header>

        <main class="home-main scroll-area">

            <!-- NOSSO DASHBOARD INTEGRADO -->
            <div class="section-headers">
                <h2>Suas Métricas Hoje</h2>
                <p>Dados sincronizados com sucesso</p>
            </div>

            <section class="card feature-card">
                <h3 style="color: #555; margin-bottom: 8px;">Passos</h3>
                <p class="numero-destaque" id="passos-display">Carregando...</p>
                <p style="font-size: 12px; color: #888;">Meta: 5000</p>
            </section>

            <div style="display: flex; gap: 16px; margin-bottom: 24px;">
                <section class="card feature-card" style="flex: 1; margin-bottom: 0;">
                    <h3 style="color: #555; margin-bottom: 8px;">Coração</h3>
                    <p id="bpm-display" class="numero-secundario">-- bpm</p>
                </section>

                <section class="card feature-card" style="flex: 1; margin-bottom: 0;">
                    <h3 style="color: #555; margin-bottom: 8px;">Calorias</h3>
                    <p id="calorias-display" class="numero-secundario">-- kcal</p>
                </section>
            </div>

            <!-- Botão do Smart Report -->
            <div class="feature-card">
                <div class="fc-content">
                    <div class="fc-icon">📋</div>
                    <div class="fc-text">
                        <h3>Smart Report Médico</h3>
                        <p>Consolide suas métricas em um PDF inteligente.</p>
                    </div>
                </div>
                <button class="btn btn-primary btn-small" id="btn-gerar-pdf">Gerar Relatório</button>
            </div>

        </main>

        <!-- Barra de Navegação -->
        <nav class="bottom-nav">
            <div class="nav-item active">
                <span class="nav-text" style="color: white;">Início</span>
            </div>
            <div class="nav-item">
                <span class="nav-text" style="color: rgba(255,255,255,0.5);">Métricas</span>
            </div>
            <div class="nav-item">
                <span class="nav-text" style="color: rgba(255,255,255,0.5);">Perfil</span>
            </div>
        </nav>
    </div>

    <!-- O NOVO JS DA HOME -->
    <script src="js/home.js"></script>
</body>

</html>
