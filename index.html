<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korasõ Médico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="app">
        <div class="loading" id="mensagem-carregando"></div>

        <div id="painel-medico" style="display: none;">
            <div class="header">
                <div>
                    <h2>Korasõ Dashboard</h2>
                    <p class="medico-nome" id="nome-medico"></p>
                </div>
                <div class="header-actions">
                    <label class="select-paciente-label" for="select-paciente">Paciente:</label>
                    <select id="select-paciente" class="select-paciente" onchange="trocarPaciente()"></select>
                    <button onclick="gerarPDF()" class="btn-success">
                        📄 Gerar Smart Report
                    </button>
                    <button id="btn-atualizar" onclick="carregarDadosPaciente()" class="btn-primary">
                        🔄 Atualizar Dados
                    </button>
                    <button type="button" class="btn-logout" onclick="logout()">Sair</button>
                </div>
            </div>

            <div class="paciente-info">
                <h1 id="nome-paciente">Carregando Nome...</h1>
                <p>Status: <strong style="color: #00995D;">Sincronizado com o App do Paciente</strong></p>
                <small>Última atualização: <span id="data-hora"></span></small>
            </div>

            <div class="dashboard">
                <div class="card">
                    <h3>BPM de Repouso</h3>
                    <div class="valor" id="bpm-valor">--</div>
                    <p>bpm</p>
                </div>
                <div class="card">
                    <h3>Passos (Média Diária)</h3>
                    <div class="valor" id="passos-valor">--</div>
                    <p>passos</p>
                </div>
                <div class="card">
                    <h3>Horas de Sono</h3>
                    <div class="valor" id="sono-valor">--</div>
                    <p>horas</p>
                </div>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        let pacienteId = null;

        async function iniciarDashboardMedico() {
            const sessao = await verificarSessao('medico');
            if (!sessao) return;

            document.getElementById('nome-medico').textContent = sessao.usuario.nome;

            const pacientes = await listarPacientes();
            const select = document.getElementById('select-paciente');
            select.innerHTML = '';

            pacientes.forEach((paciente) => {
                const option = document.createElement('option');
                option.value = paciente.id;
                option.textContent = `${paciente.nome} (#${paciente.carteirinha})`;
                select.appendChild(option);
            });

            if (pacientes.length > 0) {
                pacienteId = pacientes[0].id;
                select.value = pacienteId;
                carregarDadosPaciente();
            } else {
                document.getElementById('mensagem-carregando').innerHTML =
                    '<p>Nenhum paciente cadastrado no sistema.</p>';
            }
        }

        function trocarPaciente() {
            pacienteId = document.getElementById('select-paciente').value;
            carregarDadosPaciente();
        }

        async function carregarDadosPaciente() {
            if (!pacienteId) return;

            const btnHeader = document.getElementById('btn-atualizar');
            if (btnHeader) btnHeader.textContent = '⏳ Buscando...';

            try {
                const resposta = await fetch(`${API_BASE}/api/medico/paciente/${pacienteId}`);

                if (!resposta.ok) {
                    throw new Error('Paciente não encontrado');
                }

                const respostaCompleta = await resposta.json();
                const paciente = respostaCompleta.dados;

                document.getElementById('mensagem-carregando').style.display = 'none';
                document.getElementById('painel-medico').style.display = 'block';

                document.getElementById('nome-paciente').innerText = `Paciente: ${paciente.nome}`;
                document.getElementById('bpm-valor').innerText = paciente.bpm_repouso;
                document.getElementById('passos-valor').innerText = paciente.passos_diarios;
                document.getElementById('sono-valor').innerText = paciente.horas_sono;

                const dataFormatada = new Date(paciente.data_sincronizacao || Date.now()).toLocaleDateString('pt-BR', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit', second: '2-digit',
                });
                document.getElementById('data-hora').innerText = dataFormatada;

                const bpmEl = document.getElementById('bpm-valor');
                if (paciente.bpm_repouso > 90) {
                    bpmEl.style.color = 'red';
                } else {
                    bpmEl.style.color = '#00995D';
                }

                if (btnHeader) btnHeader.textContent = '🔄 Atualizar Dados';
            } catch (error) {
                console.error('Erro ao carregar dashboard:', error);

                document.getElementById('painel-medico').style.display = 'none';
                document.getElementById('mensagem-carregando').style.display = 'block';

                document.getElementById('mensagem-carregando').innerHTML = `
                    <div class="loading-actions">
                        <p>Aguardando o paciente enviar os dados pelo aplicativo...</p>
                        <button onclick="carregarDadosPaciente()" class="btn-primary">
                            🔄 Verificar Novamente
                        </button>
                    </div>
                `;
            }
        }

        function gerarPDF() {
            if (!pacienteId) return;
            window.open(`${API_BASE}/api/medico/paciente/${pacienteId}/pdf`, '_blank');
        }

        iniciarDashboardMedico();
    </script>
</body>
</html>
